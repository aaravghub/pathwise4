<div class="row">${goalSel()}<input id="cq" data-f="q" value="${esc(S.q)}" placeholder="Search colleges" aria-label="Search"><select data-act="st" aria-label="State">${['All',...new Set(COL.map(c=>c.st))].sort().map(s=>`<option ${S.st===s?'selected':''}>${s}</option>`).join('')}</select><label class="t"><input type="checkbox" data-act="cw" ${S.cw?'checked':''}> Use what-if grades</label></div><div id="cl">${colList()}</div>`;

return`<h2>Clubs at your school</h2><div class="row">${schoolSel()}${goalSel()}</div><div class="grid sp">${all.map(c=>{const on=S.notes.join.includes(c.n);return`<div class="card"><b>${esc(c.n)}</b>${c.t.includes(S.goal)?' <span class="chip">Matches your goal</span>':''}<p class="mu">${esc(c.d)}</p>${chips(c.t)}<div><button class="btn ${on?'on':''}" data-act="join" data-v="${esc(c.n)}">${on?'On my list ✓':'Want to join'}</button></div></div>`}).join('')||'<p class="mu">No clubs yet. Add some below.</p>'}</div>
<h3>Add a club your school has</h3><div class="row"><input id="ncn" placeholder="Club name" aria-label="Club name"><button class="btn p" data-act="addclub">Add</button></div>`};
V.opps=()=>{const l=OPP.filter(o=>o.t.includes(S.goal)||o.t.includes('all')).sort((a,b)=>a.g-b.g);return`<h2>Internships, scholarships & competitions</h2><div class="row">${goalSel()}</div><p class="mu">Always confirm eligibility and deadlines at the source.</p><div class="grid">${l.map(o=>`<div class="card"><span class="chip">${esc(o.k)}</span><span class="chip ${S.grade>=o.g?'':'w'}">${S.grade>=o.g?'Open to your grade':'Starts grade '+o.g}</span><div class="big" style="font-size:21px">${esc(o.n)}</div><p class="mu">${esc(o.d)}</p></div>`).join('')}</div>`};
V.set=()=>`<h2>Settings</h2><div class="grid">
<div class="card"><div class="lbl">You</div><p><input data-f="name" value="${esc(S.name)}" aria-label="Name"></p><p><label>Grade <select data-act="grade">${[9,10,11,12].map(n=>`<option ${S.grade===n?'selected':''}>${n}</option>`).join('')}</select></label></p><p>${schoolSel()}</p><p>${goalSel()}</p></div>
<div class="card"><div class="lbl">GPA weighting</div><p>AP +<input type="number" step=".1" value="${S.w.AP}" data-f="wt" data-l="AP" aria-label="AP bonus"> Honors +<input type="number" step=".1" value="${S.w.Honors}" data-f="wt" data-l="Honors" aria-label="Honors bonus"></p></div>
<div class="card"><div class="lbl">Show these sections</div>${TABS.map(t=>`<label class="t"><input type="checkbox" data-act="show" data-k="${t[0]}" ${S.show[t[0]]!==0?'checked':''}> ${t[1]}</label>`).join('')}</div></div>
<h3>School course catalog</h3><div class="card"><p class="mu">Add courses actually offered by your school, including the prerequisite and the minimum grade you need. These entries feed the course planner; they are not guessed from a generic school profile.</p><div class="row"><input id="scn" placeholder="Course name" aria-label="Course name"><select id="scl" aria-label="Course level"><option>CP</option><option>Honors</option><option>AP</option></select><input id="scg" type="number" min="9" max="12" value="11" aria-label="Grade offered"><input id="scp" placeholder="Prerequisite (optional)" aria-label="Prerequisite"><input id="scmin" type="number" min="0" max="100" value="85" aria-label="Minimum grade"><button class="btn p" data-act="addschoolcourse">Add course</button></div><div class="sp">${(S.schoolCourses||[]).map((c,i)=>`<div class="row"><b>${esc(c.n)}</b><span class="mu">${esc(c.l)} · Grade ${c.g} · target ${c.min}%${c.pre?' · Prereq: '+esc(c.pre):''}</span><button class="btn" data-act="delschoolcourse" data-i="${i}">Delete</button></div>`).join('')||'<p class="mu">No school-specific courses added yet.</p>'}</div></div><h3>Grab grades from Genesis (no install)</h3><div class="card"><p>Works on school computers. Make a new browser bookmark, paste the text below as its URL, open your Genesis grades page, click the bookmark, then paste the result into Import below. It reads the page you are already signed in to and never touches your password. Untested against South Brunswick’s Genesis, so check the imported classes.</p><textarea readonly aria-label="Bookmark code" style="min-height:90px" onclick="this.select()">${esc(BM)}</textarea></div><h3>Import your Genesis data</h3><div class="card"><p>A connector on your own device can sign in to Genesis and save your classes as JSON. Paste it here. Format: <code>{"name","grade","courses":[{"n","l":"AP|Honors|CP","p":1,"d":"A|B|AB","r","t","g":95,"c":1,"cats":[{"n":"Tests","w":50,"items":[{"n","s","m"}]}]}]}</code></p>
<textarea id="imp" aria-label="Import JSON" placeholder="Paste JSON here"></textarea><div class="row sp"><button class="btn p" data-act="apply">Import</button><button class="btn" data-act="exp">Export current</button><button class="btn" data-act="reset">Reset to demo</button><button class="btn" data-act="logout">Sign out</button><span id="msg" class="mu"></span></div></div>`;
const LOGIN=()=>`<div class="card" style="max-width:520px;margin:30px auto"><div class="lbl">Sign in</div><h2 style="margin-top:6px">Connect your Genesis account</h2><p class="mu">Choose your school, then connect by importing your Genesis data. Live Genesis sign-in requires a district-compatible connector; this standalone HTML cannot safely log in directly across Genesis domains.</p>
<p><select id="gs" aria-label="School" style="width:100%">${Object.entries(SCH).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join('')}</select></p><p><input id="gu" placeholder="Genesis email or username" autocomplete="username" aria-label="Username" style="width:100%"></p><p><input id="gp" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password" style="width:100%"></p>
<div class="row"><button class="btn p" data-act="login">Sign in</button><button class="btn" data-act="demo">Use the demo student</button></div>
<p class="mu sp">Security note: this standalone page does not send or store your Genesis password. Genesis districts use different portal URLs and browser protections, so live syncing needs a district-compatible local connector. Do not paste your password into this page. Use Settings to import connector JSON or your own exported data.</p></div>`;
function render(){const vis=TABS.filter(t=>S.show[t[0]]!==0).concat([['set','Settings']]);if(!vis.some(t=>t[0]===TAB))TAB=vis[0][0];
$('#so').hidden=!S.auth;$('#who').textContent=S.auth?S.name+' ':'';$('#demo').style.display=S.auth&&S.demo?'':'none';
if(!S.auth){$('#nav').innerHTML='';$('#main').innerHTML=LOGIN();return}
$('#nav').innerHTML=vis.map(t=>`<button class="${t[0]===TAB?'on':''}" data-act="tab" data-v="${t[0]}">${t[1]}</button>`).join('');$('#main').innerHTML=V[TAB]();if(S.open!=null&&TAB==='grades'){calc();const k=S.courses[S.open],el=$('#targetstatus');if(el){const g=gradeOf(k,1),tg=+(k.target??90);el.innerHTML=`<span class="chip ${g<tg?'w':''}">${g<tg?'Behind target':'On track'}</span> Current ${g.toFixed(1)}% · Target ${tg}%${g<tg?` · Need to recover ${(tg-g).toFixed(1)} percentage points`:''}`}}}
function calc(){const k=S.courses[S.open];if(!k||!$('#cr'))return;const t=+$('#ct').value,c=+$('#cc').value,m=+$('#cm').value||100;
const g=x=>{const cp=structuredClone(k);cp.cats[c].items.push({s:x,m,h:0});return gradeOf(cp,1)},g0=g(0),g1=g(m);
$('#cr').textContent=g1-g0<1e-9?'Add some assignments first.':(x=>x>m?`Even a perfect ${m}/${m} only gets you ${g1.toFixed(1)}%.`:x<=0?'You already clear that. Any score works.':`You need ${Math.ceil(x)} / ${m} (${(100*x/m).toFixed(0)}%).`)(m*(t-g0)/(g1-g0))}
function updG(){const k=S.courses[S.open];if(!k||!$('#cg'))return;$('#cg').textContent=gtxt(gradeOf(k,1));$('#ca').textContent=gtxt(gradeOf(k,0));$('#ws').textContent='Total '+k.cats.reduce((a,c)=>a+ +c.w,0)+'%';calc()}
function act(el){const a=el.dataset.act,d=el.dataset,v=el.tagName==='BUTTON'?d.v:el.value;
switch(a){
case'tab':TAB=v;break;case'day':S.day=v;break;case'clock':S.clock=v;S.clockAt=Date.now();break;case'clockoff':S.clock='';break;
case'goal':S.goal=v;break;case'grade':S.grade=+v;break;case'school':S.school=v;break;case'st':S.st=v;break;
case'cw':S.cw=el.checked?1:0;break;case'show':S.show[d.k]=el.checked?1:0;break;
case'tgt':{const i=S.targets.indexOf(v);i<0?S.targets.push(v):S.targets.splice(i,1);break}
case'open':S.open=+v;break;case'back':S.open=null;break;
case'deli':S.courses[d.i].cats[d.c].items.splice(+d.j,1);break;
case'rw':S.courses[S.open].cats.forEach(c=>c.w=c.gw);break;case'settarget':{const z=+($('#ktarget')||{}).value;if(Number.isFinite(z)&&z>=0&&z<=100)S.courses[S.open].target=z;break}
case'addi':{const s=$('#as').value;if(s==='')return;S.courses[S.open].cats[+$('#ac').value].items.push({n:$('#an').value.trim()||'Assignment',s:+s,m:+$('#am').value||100,due:($('#adue')||{}).value||'',h:$('#ah').checked?1:0});break}
case'addhw':{const t=$('#hwt').value.trim();if(!t)return;S.notes.hw.push({t,c:$('#hwc').value,d:$('#hwd').value,done:0});break}
case'delhw':S.notes.hw.splice(+d.i,1);break;
case'join':{const j=S.notes.join,i=j.indexOf(v);i<0?j.push(v):j.splice(i,1);break}
case'addclub':{const n=$('#ncn').value.trim();if(!n)return;S.myClubs.push(n);break}case'addschoolcourse':{const n=$('#scn').value.trim();if(!n)return;S.schoolCourses=S.schoolCourses||[];S.schoolCourses.push({n,l:$('#scl').value,g:+$('#scg').value||11,pre:$('#scp').value.trim(),min:Math.max(0,Math.min(100,+$('#scmin').value||85))});break}case'delschoolcourse':(S.schoolCourses||[]).splice(+d.i,1);break
case'login':case'demo':if($('#gs'))S.school=$('#gs').value;if($('#gp'))$('#gp').value='';S.auth=1;break;
case'logout':S.auth=0;break;
case'reset':{const k=DEMO();k.auth=1;S=k;TAB='sched';break}
case'exp':$('#imp').value=JSON.stringify({name:S.name,grade:S.grade,school:S.school,done:S.done,schoolCourses:S.schoolCourses||[],courses:S.courses},null,1);return;
case'apply':try{const j=JSON.parse($('#imp').value);if(!Array.isArray(j.courses)||!j.courses.length)throw 0;
S.courses=j.courses.map(k=>({n:String(k.n||'Class'),l:['AP','Honors','CP'].includes(k.l)?k.l:'CP',p:Math.min(6,Math.max(1,+k.p||1)),d:['A','B','AB'].includes(k.d)?k.d:'AB',r:String(k.r||''),t:String(k.t||''),g:+k.g||0,c:+k.c||1,target:Number.isFinite(+k.target)?+k.target:90,cats:Array.isArray(k.cats)&&k.cats.length?k.cats.map(c=>({n:String(c.n),w:+c.w||0,gw:+(c.gw??c.w)||0,items:(c.items||[]).map(i=>({n:String(i.n||'Item'),s:+i.s||0,m:+i.m||100,h:+i.h?1:0}))})):defCats()}));
if(j.name)S.name=String(j.name);if(+j.grade)S.grade=+j.grade;if(Array.isArray(j.done))S.done=j.done.map(String);if(Array.isArray(j.schoolCourses))S.schoolCourses=j.schoolCourses.filter(c=>c&&c.n).map(c=>({n:String(c.n),l:['AP','Honors','CP'].includes(c.l)?c.l:'CP',g:Math.min(12,Math.max(9,+c.g||11)),pre:String(c.pre||''),min:Math.min(100,Math.max(0,+c.min||85))}));if(j.school&&SCH[j.school])S.school=j.school;S.demo=0}catch(e){$('#msg').textContent='That JSON didn’t look right. Check the format above.';return}}
save();render()}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-act]');if(b)act(b)});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.act&&(t.tagName==='SELECT'||t.type==='checkbox'||t.type==='time'))act(t)});
document.addEventListener('input',e=>{const t=e.target,f=t.dataset.f;
if(f){const k=S.courses[t.dataset.i],c=t.dataset.c,j=t.dataset.j,v=t.type==='checkbox'?(t.checked?1:0):t.value;
if(f==='is'||f==='im'){k.cats[c].items[j][f==='is'?'s':'m']=v===''?0:+v;updG()}
else if(f==='ih'){k.cats[c].items[j].h=v;save();render();return}
else if(f==='cw'){k.cats[c].w=+v||0;updG()}
else if(f==='name'){S.name=v}
else if(f==='wt')S.w[t.dataset.l]=+v||0;
else if(f==='ng')S.notes.goals=v;else if(f==='nf')S.notes.free=v;
else if(f==='hd'){S.notes.hw[t.dataset.i].done=v;save();render();return}
else if(f==='q'){S.q=v;$('#cl').innerHTML=colList()}
save()}
if(['ct','cc','cm'].includes(t.id))calc()});
setInterval(()=>{const h=$('#hero');if(h&&S.auth&&TAB==='sched')h.innerHTML=heroHtml()},1000);
render();
</script>
<script src="/connector.js"></script>
</body>
</html>
